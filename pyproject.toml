[project]
name = "airia-sentinel"
version = "1.0.0"
description = "Airia Sentinel — Multi-Agent Treasury Orchestration & Risk Management"
requires-python = ">=3.13"
dependencies = [
    "airia>=0.1.41",
    "ccxt>=4.0",
    "httpx>=0.28",
    "pydantic>=2.12",
    "reportlab>=4.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-dotenv>=1.0",
    "rich>=14.0",
    "numpy>=2.0",
    "edge-tts>=7.2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
